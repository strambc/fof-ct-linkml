id: https://w3id.org/fof-ct/cell
name: fof_bas_ct_cell
description: >-
  FISH Omics Format for Chromatin Tracing - Ball-and-Stick modality (FOF-bas-CT).
  LinkML schema for the optional Cell Data table (table 9). Documents properties
  globally associated with individual Cells (e.g. cell size, volume, cell type,
  cell cycle state, RNA spot count). Each row is one Cell. This table is optional
  but recommended and MUST contain at least one user-defined optional column
  (added via #^ header lines in the TSV file). Modelled after the SSSOM pattern:
  a row-level class (Cell) captures per-cell properties; a container class
  (CellTable) holds the full collection together with dataset-level provenance
  metadata written in the FOF-CT file header.
license: CC-BY-4.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  fof_ct: https://w3id.org/fof-ct/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: fof_ct
default_range: string

imports:
  - linkml:types
  - fof_bas_ct_common

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  Cell:
    description: >-
      A single Cell identified in a FOF-bas-CT experiment. Each instance of
      this class corresponds to one row in the TSV data section of the FOF-CT
      Cell Data table. The cell_id field uniquely identifies each Cell and
      links to the core table, the Sub-Cell ROI Data table, and the Cell/ROI
      Mapping table. This class accepts additional user-defined optional columns
      (e.g. Cell_Size, Cell_Volume, Cell_Cycle_State, RNA_Spot_Count) via
      open schema. At least one such user-defined column MUST
      be present per submission.
    slots:
      - cell_id
      - extra_cell_roi_id
    slot_usage:
      cell_id:
        identifier: true
        required: true
        range: integer
        description: >-
          Unique integer identifier for this Cell. Cell_ID values are unique
          across the entire dataset, enabling unambiguous cross-referencing
          with the core table, the Sub-Cell ROI Data table, and the Cell/ROI
          Mapping table.
      extra_cell_roi_id:
        required: false
        range: integer
        description: >-
          Identifier of the extracellular structure ROI (e.g. tissue section,
          organoid) that contains this Cell. Conditionally required when this
          Cell can be associated with an extracellular ROI identified as part
          of this experiment and reported in a dedicated Extra-Cell ROI Data
          table.

  CellTable:
    description: >-
      The Cell Data table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_cell). This class represents the entire file: it holds all
      dataset-level provenance metadata (recorded as header lines in the TSV
      serialisation) together with the full collection of Cells (recorded as
      data rows). This table is optional but recommended. Analogous to the
      MappingSet class in SSSOM.
    tree_root: true
    slots:
      # --- mandatory header fields ---
      - fof_ct_version
      - table_namespace
      - cell_type
      - lab_name
      - experimenter_name
      - experimenter_contact
      - description
      - additional_tables
      # --- conditional header fields ---
      - extra_cell_roi_type
      - softwares
      - xyz_unit
      - time_unit
      - intensity_unit
      - intensity_measurement_method
      # --- data ---
      - cells
    slot_usage:
      fof_ct_version:
        required: true
      table_namespace:
        required: true
        equals_string: 4dn_FOF-CT_cell
      cell_type:
        required: true
      lab_name:
        required: true
      experimenter_name:
        required: true
      experimenter_contact:
        required: true
      description:
        required: true
      additional_tables:
        required: true
      extra_cell_roi_type:
        required: false
      softwares:
        required: false
        multivalued: true
        range: Software
      xyz_unit:
        required: true
      time_unit:
        required: false
      intensity_unit:
        required: false
      intensity_measurement_method:
        required: false
      cells:
        required: true

# ---------------------------------------------------------------------------
# Slots (only slots NEW to this schema — all shared slots come from fof_bas_ct_common)
# ---------------------------------------------------------------------------

slots:



  cells:
    description: >-
      The complete collection of Cells constituting this dataset. Each Cell
      corresponds to one data row in the TSV serialisation. At least one
      user-defined optional column (e.g. Cell_Size, Cell_Volume) MUST be
      present in every submitted Cell Data table.
    domain: CellTable
    range: Cell
    multivalued: true
    inlined_as_list: true
