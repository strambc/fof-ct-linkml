id: https://w3id.org/fof-ct/subcell
name: fof_bas_ct_subcell
description: >-
  FISH Omics Format for Chromatin Tracing - Ball-and-Stick modality (FOF-bas-CT).
  LinkML schema for the optional Sub-Cell ROI Data table (table 11). Documents
  properties globally associated with individual sub-cellular structure ROIs
  (e.g. nucleolus, nuclear lamina, PML bodies, chromosome domains). Each row
  is one sub-cellular ROI. This table is optional but recommended and MUST
  contain at least one user-defined optional column (added via #^ header lines
  in the TSV file). Modelled after the SSSOM pattern: a row-level class
  (SubCellROI) captures per-ROI properties; a container class (SubCellROITable)
  holds the full collection together with dataset-level provenance metadata
  written in the FOF-CT file header.
license: CC-BY-4.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  fof_ct: https://w3id.org/fof-ct/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: fof_ct
default_range: string

imports:
  - linkml:types
  - fof_bas_ct_common

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  SubCellROI:
    description: >-
      A single sub-cellular structure ROI (e.g. nucleolus, nuclear lamina,
      PML body, chromosome domain) identified in a FOF-bas-CT experiment.
      Each instance of this class corresponds to one row in the TSV data
      section of the FOF-CT Sub-Cell ROI Data table. The sub_cell_roi_id
      field uniquely identifies each ROI and links to the core table, the
      Cell Data table, and the Cell/ROI Mapping table. This class accepts
      additional user-defined optional columns (e.g. ROI_Volume, ROI_Area).
      At least one such user-defined column MUST be present per submission.
    slots:
      - sub_cell_roi_id
      - cell_id
    slot_usage:
      sub_cell_roi_id:
        identifier: true
        required: true
        range: integer
        description: >-
          Unique integer identifier for this sub-cellular structure ROI.
          Sub_Cell_ROI_ID values are unique across the entire dataset,
          enabling unambiguous cross-referencing with the core table, the
          Cell Data table, and the Cell/ROI Mapping table.
      cell_id:
        required: false
        range: integer
        description: >-
          Identifier of the Cell to which this sub-cellular ROI belongs.
          Conditionally required when this ROI can be associated with a Cell
          identified as part of this experiment and reported in a dedicated
          Cell Data table.

  SubCellROITable:
    description: >-
      The Sub-Cell ROI Data table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_subcell). This class represents the entire file: it holds
      all dataset-level provenance metadata (recorded as header lines in the
      TSV serialisation) together with the full collection of sub-cellular
      ROIs (recorded as data rows). This table is optional but recommended.
      Analogous to the MappingSet class in SSSOM.
    tree_root: true
    slots:
      # --- mandatory header fields ---
      - fof_ct_version
      - table_namespace
      - sub_cell_roi_type
      - lab_name
      - experimenter_name
      - experimenter_contact
      - description
      - additional_tables
      # --- conditional header fields ---
      - cell_type
      - softwares
      - xyz_unit
      - time_unit
      - intensity_unit
      - intensity_measurement_method
      # --- data ---
      - sub_cell_rois
    slot_usage:
      fof_ct_version:
        required: true
      table_namespace:
        required: true
        equals_string: 4dn_FOF-CT_subcell
      sub_cell_roi_type:
        required: true
      lab_name:
        required: true
      experimenter_name:
        required: true
      experimenter_contact:
        required: true
      description:
        required: true
      additional_tables:
        required: true
      cell_type:
        required: false
      softwares:
        required: false
        multivalued: true
        range: Software
      xyz_unit:
        required: false
      time_unit:
        required: false
      intensity_unit:
        required: false
      intensity_measurement_method:
        required: false
      sub_cell_rois:
        required: true

# ---------------------------------------------------------------------------
# Slots (only slots NEW to this schema — all shared slots come from fof_bas_ct_common)
# ---------------------------------------------------------------------------

slots:



  sub_cell_rois:
    description: >-
      The complete collection of sub-cellular ROIs constituting this dataset.
      Each SubCellROI corresponds to one data row in the TSV serialisation.
      At least one user-defined optional column (e.g. ROI_Volume, ROI_Area)
      MUST be present in every submitted Sub-Cell ROI Data table.
    domain: SubCellROITable
    range: SubCellROI
    multivalued: true
    inlined_as_list: true
