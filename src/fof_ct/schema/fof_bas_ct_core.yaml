id: https://w3id.org/fof-ct
name: fof_bas_ct_core
description: >-
  FISH Omics Format for Chromatin Tracing - Ball-and-Stick modality (FOF-bas-CT).
  LinkML schema for the mandatory DNA-Spot/Trace Data core table (table 1 core).
  Modelled after the SSSOM pattern: a row-level class (Spot) captures each
  detected bright Spot; a container class (SpotTable) holds the full collection
  of Spots together with the dataset-level provenance metadata that is written
  in the FOF-CT file header.
  Imports fof_bas_ct_common for all shared slots, the Software class, and enums.
license: CC-BY-4.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  fof_ct: https://w3id.org/fof-ct/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: fof_ct
default_range: string

imports:
  - linkml:types
  - fof_bas_ct_common

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  Spot:
    description: >-
      A single DNA-FISH bright Spot detected in a ball-and-stick Chromatin
      Tracing experiment. Each instance of this class corresponds to one row
      in the TSV data section of the FOF-CT core table and represents a
      specific genomic target sequence localised in 3D space and assigned to
      a chromatin Trace.
    mixins:
      - SpotMixin
    slots:
      - spot_id
      - trace_id
      - chrom
      - chrom_start
      - chrom_end
    slot_usage:
      spot_id:
        identifier: true
        required: true
      trace_id:
        required: true
      x:
        required: true
      y:
        required: true
      z:
        required: true
      chrom:
        required: true
      chrom_start:
        required: true
      chrom_end:
        required: true

  SpotTable:
    description: >-
      The DNA-Spot/Trace Data core table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_core). This class represents the entire file: it holds all
      dataset-level provenance metadata (recorded as header lines in the TSV
      serialisation) together with the full collection of Spots (recorded as
      data rows). Analogous to the MappingSet class in SSSOM.
    tree_root: true
    slots:
      # --- mandatory header fields (shared, from fof_bas_ct_common) ---
      - fof_ct_version
      - table_namespace
      - genome_assembly
      - xyz_unit
      - lab_name
      - experimenter_name
      - experimenter_contact
      - description
      - softwares
      - additional_tables
      - spots
      # --- conditional header fields (genome modification, core-specific) ---
      - modification
      - vcf_file_name
      - vcf_version
    slot_usage:
      fof_ct_version:
        required: true
      table_namespace:
        required: true
        equals_string: 4dn_FOF-CT_core
      genome_assembly:
        required: true
      xyz_unit:
        required: true
      lab_name:
        required: true
      experimenter_name:
        required: true
      experimenter_contact:
        required: true
      description:
        required: true
      softwares:
        required: true
      spots:
        required: true

# ---------------------------------------------------------------------------
# Slots unique to this table (not in fof_bas_ct_common)
# ---------------------------------------------------------------------------

slots:

  # ---- SpotTable-level: genome / modification header slots ----------------
  # NOTE: modification, vcf_file_name, and vcf_version moved to
  # fof_bas_ct_common.yaml (domain-agnostic) so fof_vol_ct_core.yaml's
  # SMLocalizationTable can reuse them too — the vol_core table has the same
  # Modification/VCF_File_Name/VCF_Version conditional header fields as core.

  spots:
    description: >-
      The complete collection of Spots constituting this dataset. Each Spot
      corresponds to one data row in the TSV serialisation.
    domain: SpotTable
    range: Spot
    multivalued: true
    inlined_as_list: true

  # ---- Spot row-level slots -----------------------------------------------
  # NOTE: chrom, chrom_start, chrom_end moved to fof_bas_ct_common.yaml
  # (domain-agnostic). Previously both this file (domain: Spot) and
  # fof_vol_ct_core.yaml (no domain) defined these same slot names
  # independently; since fof_ct.yaml imports both schemas together, that
  # produced two conflicting definitions of the same slot in the merged
  # schema. Consolidating avoids the conflict and matches how every other
  # cross-table shared slot in this schema is already handled.
