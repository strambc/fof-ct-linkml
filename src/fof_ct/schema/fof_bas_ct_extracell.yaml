id: https://w3id.org/fof-ct/extracell
name: fof_bas_ct_extracell
description: >-
  FISH Omics Format for Chromatin Tracing - Ball-and-Stick modality (FOF-bas-CT).
  LinkML schema for the optional Extra-Cell ROI Data table (table 10). Documents
  properties globally associated with individual extracellular structure ROIs
  (e.g. tissue sections, organoids) — such as volume and cell counts. Each row
  is one extracellular ROI. This table is optional but recommended and MUST
  contain at least one user-defined optional column (added via #^ header lines
  in the TSV file). Modelled after the SSSOM pattern: a row-level class
  (ExtraCellROI) captures per-ROI properties; a container class
  (ExtraCellROITable) holds the full collection together with dataset-level
  provenance metadata written in the FOF-CT file header.
license: CC-BY-4.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  fof_ct: https://w3id.org/fof-ct/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: fof_ct
default_range: string

imports:
  - linkml:types
  - fof_bas_ct_common

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  ExtraCellROI:
    description: >-
      A single extracellular structure ROI (e.g. a tissue section or organoid)
      identified in a FOF-bas-CT experiment. Each instance of this class
      corresponds to one row in the TSV data section of the FOF-CT Extra-Cell
      ROI Data table. The extra_cell_roi_id field uniquely identifies each ROI
      and links to the core table, the RNA Spot Data table, and the Cell Data
      table. This class accepts additional user-defined optional columns (e.g.
      ROI_Volume, Cell_Count). At least one
      such user-defined column MUST be present per submission.
    slots:
      - extra_cell_roi_id
    slot_usage:
      extra_cell_roi_id:
        identifier: true
        required: true
        range: integer
        description: >-
          Unique integer identifier for this extracellular structure ROI.
          Extra_Cell_ROI_ID values are unique across the entire dataset,
          enabling unambiguous cross-referencing with the core table, the RNA
          Spot Data table, and the Cell Data table.

  ExtraCellROITable:
    description: >-
      The Extra-Cell ROI Data table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_extracell). This class represents the entire file: it holds
      all dataset-level provenance metadata (recorded as header lines in the
      TSV serialisation) together with the full collection of extracellular
      ROIs (recorded as data rows). This table is optional but recommended.
      Analogous to the MappingSet class in SSSOM.
    tree_root: true
    slots:
      # --- mandatory header fields ---
      - fof_ct_version
      - table_namespace
      - extra_cell_roi_type
      - lab_name
      - experimenter_name
      - experimenter_contact
      - description
      - additional_tables
      # --- conditional header fields ---
      - softwares
      - xyz_unit
      - time_unit
      - intensity_unit
      - intensity_measurement_method
      # --- data ---
      - extra_cell_rois
    slot_usage:
      fof_ct_version:
        required: true
      table_namespace:
        required: true
        equals_string: 4dn_FOF-CT_extracell
      extra_cell_roi_type:
        required: true
      lab_name:
        required: true
      experimenter_name:
        required: true
      experimenter_contact:
        required: true
      description:
        required: true
      additional_tables:
        required: true
      softwares:
        required: false
        multivalued: true
        range: Software
      xyz_unit:
        required: false
      time_unit:
        required: false
      intensity_unit:
        required: false
      intensity_measurement_method:
        required: false
      extra_cell_rois:
        required: true

# ---------------------------------------------------------------------------
# Slots (only slots NEW to this schema — all shared slots come from fof_bas_ct_common)
# ---------------------------------------------------------------------------

slots:


  extra_cell_rois:
    description: >-
      The complete collection of extracellular ROIs constituting this dataset.
      Each ExtraCellROI corresponds to one data row in the TSV serialisation.
      At least one user-defined optional column (e.g. ROI_Volume, Cell_Count)
      MUST be present in every submitted Extra-Cell ROI Data table.
    domain: ExtraCellROITable
    range: ExtraCellROI
    multivalued: true
    inlined_as_list: true
