id: https://w3id.org/fof-ct/mapping
name: fof_bas_ct_mapping
description: >-
  FISH Omics Format for Chromatin Tracing - Ball-and-Stick modality (FOF-bas-CT).
  LinkML schema for the conditionally required Cell/ROI Mapping table (table 12).
  Required whenever a Cell Data table, a Sub-Cell ROI Data table, or an
  Extra-Cell ROI Data table is deposited. Provides the boundaries of Cells and
  ROIs expressed in global image coordinates, enabling spatial reconstruction
  and cross-table linkage. Each row corresponds to one Cell, one Sub-Cell ROI,
  or one Extra-Cell ROI. The first column must be exactly ONE of:
  Sub_Cell_ROI_ID, Cell_ID, or Extra_Cell_ROI_ID — all rows within a single
  file must use the same identifier column; the same file MUST NOT mix
  identifier types. Boundaries may follow the OME ROI data model (e.g. polygon
  "x1,y1 x2,y2 ..."), OBJ 3D mesh format, or any other format described in
  roi_boundaries_format. Modelled after the SSSOM pattern: a row-level class
  (ROIMapping) captures per-ROI boundary data; a container class
  (ROIMappingTable) holds the full collection together with dataset-level
  provenance metadata written in the FOF-CT file header.
license: CC-BY-4.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  fof_ct: https://w3id.org/fof-ct/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: fof_ct
default_range: string

imports:
  - linkml:types
  - fof_bas_ct_common

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  ROIMapping:
    description: >-
      A single boundary record for one Cell, Sub-Cell ROI, or Extra-Cell ROI
      in a FOF-bas-CT experiment. Each instance corresponds to one row in the
      TSV data section of the FOF-CT Cell/ROI Mapping table. Exactly one of
      the three identifier slots (sub_cell_roi_id, cell_id, extra_cell_roi_id)
      must be populated per file; the choice of identifier must be consistent
      across all rows of a given submission. The roi_boundaries slot holds the
      boundary coordinates in the format specified by roi_boundaries_format in
      the table header. This class accepts additional user-defined optional
      columns.
    slots:
      - sub_cell_roi_id
      - cell_id
      - extra_cell_roi_id
      - roi_boundaries
    slot_usage:
      sub_cell_roi_id:
        required: false
        range: integer
        description: >-
          Unique identifier for the Sub-Cell ROI whose boundaries are described
          in this row. Conditionally required when this file contains sub-
          cellular ROI boundary data. Exactly one of sub_cell_roi_id, cell_id,
          or extra_cell_roi_id must be used consistently throughout the file.
      cell_id:
        required: false
        range: integer
        description: >-
          Unique identifier for the Cell whose boundaries are described in this
          row. Conditionally required when this file contains Cell boundary
          data. Exactly one of sub_cell_roi_id, cell_id, or extra_cell_roi_id
          must be used consistently throughout the file.
      extra_cell_roi_id:
        required: false
        range: integer
        description: >-
          Unique identifier for the extracellular structure ROI whose
          boundaries are described in this row. Conditionally required when
          this file contains Extra-Cell ROI boundary data. Exactly one of
          sub_cell_roi_id, cell_id, or extra_cell_roi_id must be used
          consistently throughout the file.
      roi_boundaries:
        required: true

  ROIMappingTable:
    description: >-
      The Cell/ROI Mapping table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_mapping). This class represents the entire file: it holds all
      dataset-level provenance metadata (recorded as header lines in the TSV
      serialisation) together with the full collection of ROI boundary records
      (recorded as data rows). This table is conditionally required whenever a
      Cell Data table, a Sub-Cell ROI Data table, or an Extra-Cell ROI Data
      table is deposited. Analogous to the MappingSet class in SSSOM.
    tree_root: true
    slots:
      # --- mandatory header fields ---
      - fof_ct_version
      - table_namespace
      - roi_boundaries_format
      - xyz_unit
      - lab_name
      - experimenter_name
      - experimenter_contact
      - description
      - additional_tables
      # --- conditional header fields ---
      - cell_type
      - sub_cell_roi_type
      - extra_cell_roi_type
      - softwares
      - time_unit
      - intensity_unit
      - intensity_measurement_method
      # --- data ---
      - roi_mappings
    slot_usage:
      fof_ct_version:
        required: true
      table_namespace:
        required: true
        equals_string: 4dn_FOF-CT_mapping
      roi_boundaries_format:
        required: true
      xyz_unit:
        required: true
      lab_name:
        required: true
      experimenter_name:
        required: true
      experimenter_contact:
        required: true
      description:
        required: true
      additional_tables:
        required: true
      cell_type:
        required: false
      sub_cell_roi_type:
        required: false
      extra_cell_roi_type:
        required: false
      softwares:
        required: false
        multivalued: true
        range: Software
      time_unit:
        required: false
      intensity_unit:
        required: false
      intensity_measurement_method:
        required: false
      roi_mappings:
        required: true

# ---------------------------------------------------------------------------
# Slots (only slots NEW to this schema — all shared slots come from fof_bas_ct_common)
# ---------------------------------------------------------------------------

slots:

  roi_boundaries_format:
    description: >-
      Description of the coordinate format used to encode boundary data in
      the roi_boundaries column. Examples include the OME ROI Polygon model
      (coordinates as "x1,y1 x2,y2 ...") and the OBJ 3D mesh format (vertex
      and face lists). Must be sufficient for unambiguous parsing of all
      roi_boundaries values in this file. Written as #ROI_Boundaries_Format:
      in the file header.
    domain: ROIMappingTable
    range: string
    examples:
      - value: OME ROI Polygon model
      - value: OBJ 3D mesh

  roi_boundaries:
    description: >-
      Boundary coordinates for this Cell or ROI, encoded in the format
      specified by roi_boundaries_format in the table header. For the OME ROI
      Polygon model, coordinates are provided as a space-separated list of
      "x,y" pairs (e.g. "12.5,40.2 13.1,41.0 ..."). For OBJ 3D mesh format,
      the field contains the vertex and face list for the boundary mesh.
    domain: ROIMapping
    range: string
    examples:
      - value: "12.5,40.2 13.1,41.0 14.0,40.5 13.5,39.8"
      - value: "v 1.0 2.0 3.0\nv 4.0 5.0 6.0\nf 1 2 3"

  roi_mappings:
    description: >-
      The complete collection of ROI boundary records constituting this
      dataset. Each ROIMapping corresponds to one data row in the TSV
      serialisation.
    domain: ROIMappingTable
    range: ROIMapping
    multivalued: true
    inlined_as_list: true



