id: https://w3id.org/fof-ct/rna_quality
name: fof_bas_ct_rna_quality
description: >-
  FISH Omics Format for Chromatin Tracing - Ball-and-Stick modality (FOF-bas-CT).
  LinkML schema for the optional RNA Spot Quality table (table 6). Stores
  quality metrics associated with individual RNA bright Spots (e.g.
  signal-to-noise ratio, localization uncertainty, fit quality). Indexed by
  RNA_Spot_ID. This table MUST contain at least one user-defined optional
  column describing an RNA spot quality metric, declared via #^ header lines.
license: CC-BY-4.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  fof_ct: https://w3id.org/fof-ct/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: fof_ct
default_range: string

imports:
  - linkml:types
  - fof_bas_ct_common

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  RNASpotQualityRecord:
    description: >-
      A single row in the RNA Spot Quality table. Each instance captures one
      or more quality metrics for a specific RNA bright Spot identified by
      RNA_Spot_ID. RNA_Spot_ID values must be unique across the dataset,
      linking to the corresponding record in the RNA Spot Data table (table 4).
      RNA_Spot_ID, Channel and Fluor are mandatory; all other reserved
      quality-metric columns are conditionally required (the same reserved
      vocabulary as the Spot Quality table) or fully free-form; users declare
      the latter via #^ header lines.
    extra_slots:
      allowed: true
    slots:
      - rna_spot_id
      - channel_name
      - fluorophore_name
      - x_precision
      - y_precision
      - z_precision
      - photon_count
      - goodness_of_fit
      - centroid_intensity
      - peak_intensity
      - raw_x
      - raw_y
      - raw_z
      - x_drift
      - y_drift
      - z_drift
      - x_chromatic_shift
      - y_chromatic_shift
      - z_chromatic_shift
      - x_loc_error
      - y_loc_error
      - z_loc_error
    slot_usage:
      rna_spot_id:
        required: true
        identifier: true
      channel_name:
        required: true
      fluorophore_name:
        required: true
      x_precision:
        required: false
      y_precision:
        required: false
      z_precision:
        required: false
      photon_count:
        required: false
      goodness_of_fit:
        required: false
      centroid_intensity:
        required: false
      peak_intensity:
        required: false
      raw_x:
        required: false
      raw_y:
        required: false
      raw_z:
        required: false
      x_drift:
        required: false
      y_drift:
        required: false
      z_drift:
        required: false
      x_chromatic_shift:
        required: false
      y_chromatic_shift:
        required: false
      z_chromatic_shift:
        required: false
      x_loc_error:
        required: false
      y_loc_error:
        required: false
      z_loc_error:
        required: false

  RNASpotQualityTable:
    description: >-
      The RNA Spot Quality table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_rna_quality). This class represents the entire file: it
      holds all dataset-level provenance metadata (recorded as header lines
      in the TSV serialisation) together with the full collection of
      RNASpotQualityRecord rows. Submission of this table is optional but
      recommended.
    tree_root: true
    slots:
      # --- mandatory header fields ---
      - fof_ct_version
      - table_namespace
      - lab_name
      - experimenter_name
      - experimenter_contact
      - description
      - additional_tables
      # --- conditional header fields ---
      - softwares
      - xyz_unit
      - time_unit
      - intensity_unit
      - intensity_measurement_method
      # --- data rows ---
      - rna_spot_quality_records
    slot_usage:
      fof_ct_version:
        required: true
      table_namespace:
        required: true
        equals_string: 4dn_FOF-CT_rna_quality
        description: >-
          Identifier for this table type. Must always be
          '4dn_FOF-CT_rna_quality'. Written as ##Table_Namespace= in the
          file header.
      lab_name:
        required: true
      experimenter_name:
        required: true
      experimenter_contact:
        required: true
      description:
        required: true
      additional_tables:
        required: true
      softwares:
        required: false
        description: >-
          One or more Software entries documenting every tool used to produce
          or process data in this table. Required only when software was used;
          omit the block entirely if no software was applied. Written as
          repeating #Software_* blocks in the file header.
      xyz_unit:
        required: true
      time_unit:
        required: false
        description: >-
          Unit used for any time metric reported in user-defined columns.
          Conditionally required when any such metric is present. Written as
          ##Time_Unit= in the file header.
      intensity_unit:
        required: false
        description: >-
          Unit used for any intensity metric reported in user-defined columns.
          Conditionally required when any such metric is present. Written as
          ##Intensity_Unit= in the file header.
      intensity_measurement_method:
        required: false
        description: >-
          Method used to perform intensity measurements. Conditionally required
          when any intensity metric is present. Written as
          #Intensity_Measurement_Method: in the file header.
      rna_spot_quality_records:
        required: true

# ---------------------------------------------------------------------------
# Slots local to this schema
# ---------------------------------------------------------------------------

slots:


  rna_spot_quality_records:
    description: >-
      The complete collection of RNASpotQualityRecord rows constituting this
      dataset. Each record corresponds to one data row in the TSV
      serialisation and must include at least one user-defined quality
      metric column.
    domain: RNASpotQualityTable
    range: RNASpotQualityRecord
    multivalued: true
    inlined_as_list: true
