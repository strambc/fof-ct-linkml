id: https://w3id.org/fof-ct/rna_bio
name: fof_bas_ct_rna_bio
description: >-
  FISH Omics Format for Chromatin Tracing - Ball-and-Stick modality (FOF-bas-CT).
  LinkML schema for the optional (highly recommended) RNA Spot Biological Data
  table (table 8). Stores biological properties associated with individual RNA
  bright Spots (e.g. distance from nuclear lamina, distance from nuclear pore
  complexes). Indexed by RNA_Spot_ID. The specific columns reported are at
  the user's discretion; this table MUST contain at least one user-defined
  optional column describing a biological property, declared via #^ header lines.
license: CC-BY-4.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  fof_ct: https://w3id.org/fof-ct/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: fof_ct
default_range: string

imports:
  - linkml:types
  - fof_bas_ct_common

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  RNASpotBiologicalRecord:
    description: >-
      A single row in the RNA Spot Biological Data table. Each instance
      captures one or more user-defined biological properties for a specific
      RNA bright Spot identified by RNA_Spot_ID. RNA_Spot_ID values must be
      unique across the dataset, linking to the corresponding record in the
      RNA Spot Data table (table 4). At least one user-defined biological
      property column MUST be present; users declare these via #^ header lines.
    slots:
      - rna_spot_id
    slot_usage:
      rna_spot_id:
        required: true
        identifier: true

  RNASpotBiologicalTable:
    description: >-
      The RNA Spot Biological Data table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_rna_bio). This class represents the entire file: it holds
      all dataset-level provenance metadata (recorded as header lines in the
      TSV serialisation) together with the full collection of
      RNASpotBiologicalRecord rows. Submission of this table is optional but
      highly recommended.
    tree_root: true
    slots:
      # --- mandatory header fields ---
      - fof_ct_version
      - table_namespace
      - lab_name
      - experimenter_name
      - experimenter_contact
      - description
      - additional_tables
      # --- conditional header fields ---
      - softwares
      - xyz_unit
      - time_unit
      - intensity_unit
      - intensity_measurement_method
      # --- data rows ---
      - rna_spot_biological_records
    slot_usage:
      fof_ct_version:
        required: true
      table_namespace:
        required: true
        equals_string: 4dn_FOF-CT_rna_bio
        description: >-
          Identifier for this table type. Must always be '4dn_FOF-CT_rna_bio'.
          Written as ##Table_Namespace= in the file header.
      lab_name:
        required: true
      experimenter_name:
        required: true
      experimenter_contact:
        required: true
      description:
        required: true
      additional_tables:
        required: true
      softwares:
        required: false
        description: >-
          One or more Software entries documenting every tool used to produce
          or process data in this table. Required only when software was used;
          omit the block entirely if no software was applied. Written as
          repeating #Software_* blocks in the file header.
      xyz_unit:
        required: true
      time_unit:
        required: false
        description: >-
          Unit used for any time metric reported in user-defined columns.
          Conditionally required when any such metric is present. Written as
          ##Time_Unit= in the file header.
      intensity_unit:
        required: false
        description: >-
          Unit used for any intensity metric reported in user-defined columns.
          Conditionally required when any such metric is present. Written as
          ##Intensity_Unit= in the file header.
      intensity_measurement_method:
        required: false
        description: >-
          Method used to perform intensity measurements. Conditionally required
          when any intensity metric is present. Written as
          #Intensity_Measurement_Method: in the file header.
      rna_spot_biological_records:
        required: true

# ---------------------------------------------------------------------------
# Slots local to this schema
# ---------------------------------------------------------------------------

slots:


  rna_spot_biological_records:
    description: >-
      The complete collection of RNASpotBiologicalRecord rows constituting
      this dataset. Each record corresponds to one data row in the TSV
      serialisation and must include at least one user-defined biological
      property column.
    domain: RNASpotBiologicalTable
    range: RNASpotBiologicalRecord
    multivalued: true
    inlined_as_list: true
