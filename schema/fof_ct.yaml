  ROIMapping:
    name: ROIMapping
    definition_uri: https://w3id.org/fof-ct/ROIMapping
    description: A single boundary record for one Cell, Sub-Cell ROI, or Extra-Cell
      ROI in a FOF-bas-CT experiment. Each instance corresponds to one row in the
      TSV data section of the FOF-CT Cell/ROI Mapping table. Exactly one of the three
      identifier slots (sub_cell_roi_id, cell_id, extra_cell_roi_id) must be populated
      per file; the choice of identifier must be consistent across all rows of a given
      submission. The roi_boundaries slot holds the boundary coordinates in the format
      specified by roi_boundaries_format in the table header. This class accepts additional
      user-defined optional columns.
    from_schema: https://w3id.org/fof-ct/mapping
