name: fof_ct
description: "Root schema for the FISH Omics Format for Chromatin Tracing (FOF-CT).\
  \ Covers both modalities: FOF-bas-CT (ball-and-stick, tables 1\u201312) and FOF-vol-CT\
  \ (volumetric, tables 13\u201315). Imports all fifteen table schemas that together\
  \ constitute the complete FOF-CT data model. Each table schema in turn imports fof_bas_ct_common\
  \ for shared slots, the Software class, and enumerations."
title: FISH Omics Format for Chromatin Tracing (FOF-CT)
see_also:
- https://4dn-dcic.github.io/fof-ct
- https://fish-omics-format.readthedocs.io/
id: https://w3id.org/fof-ct
version: 1.0.0
imports:
- linkml:types
- fof_bas_ct_common
- fof_bas_ct_core
- fof_bas_ct_demultiplexing
- fof_bas_ct_trace
- fof_bas_ct_rna
- fof_bas_ct_quality
- fof_bas_ct_rna_quality
- fof_bas_ct_bio
- fof_bas_ct_rna_bio
- fof_bas_ct_cell
- fof_bas_ct_extracell
- fof_bas_ct_subcell
- fof_bas_ct_mapping
- fof_vol_ct_core
- fof_vol_ct_quality
- fof_vol_ct_undecoded
license: MIT
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  fof_ct:
    prefix_prefix: fof_ct
    prefix_reference: https://w3id.org/fof-ct/
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: fof_ct
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  XYZUnitEnum:
    name: XYZUnitEnum
    definition_uri: https://w3id.org/fof-ct/XYZUnitEnum
    description: Allowed units for X, Y, Z spatial coordinates or distances.
    from_schema: https://w3id.org/fof-ct/common
    permissible_values:
      nm:
        text: nm
        description: Nanometres
      micron:
        text: micron
        description: "Micrometres. Use 'micron' rather than the Greek symbol \u03BC\
          m to avoid encoding issues."
      mm:
        text: mm
        description: Millimetres
  TimeUnitEnum:
    name: TimeUnitEnum
    definition_uri: https://w3id.org/fof-ct/TimeUnitEnum
    description: Allowed units for time intervals.
    from_schema: https://w3id.org/fof-ct/common
    permissible_values:
      s:
        text: s
        description: Seconds (SI base unit)
      sec:
        text: sec
        description: Seconds (alternative spelling accepted by FOF-CT)
      ms:
        text: ms
        description: Milliseconds
      min:
        text: min
        description: Minutes
      hr:
        text: hr
        description: Hours
  SoftwareTypeEnum:
    name: SoftwareTypeEnum
    definition_uri: https://w3id.org/fof-ct/SoftwareTypeEnum
    description: Allowed functional categories for software tools.
    from_schema: https://w3id.org/fof-ct/common
    permissible_values:
      SpotLoc:
        text: SpotLoc
        description: Spot localisation software
      Tracing:
        text: Tracing
        description: Chromatin tracing software
      SpotLoc+Tracing:
        text: SpotLoc+Tracing
        description: Combined spot localisation and tracing software
      Segmentation:
        text: Segmentation
        description: Image segmentation software
      QC:
        text: QC
        description: Quality control software
      Distance:
        text: Distance
        description: Distance calculation software
      Other:
        text: Other
        description: Other software type
  TableNamespaceEnum:
    name: TableNamespaceEnum
    definition_uri: https://w3id.org/fof-ct/TableNamespaceEnum
    description: Allowed namespace identifiers for FOF-CT tables that may be listed
      in the additional_tables field.
    from_schema: https://w3id.org/fof-ct/common
    permissible_values:
      4dn_FOF-CT_core:
        text: 4dn_FOF-CT_core
        description: DNA-Spot/Trace Data core table (table 1)
      4dn_FOF-CT_demultiplexing:
        text: 4dn_FOF-CT_demultiplexing
        description: Spot Demultiplexing table (table 2)
      4dn_FOF-CT_trace:
        text: 4dn_FOF-CT_trace
        description: Trace Data table (table 3)
      4dn_FOF-CT_rna:
        text: 4dn_FOF-CT_rna
        description: RNA Spot Data table (table 4)
      4dn_FOF-CT_quality:
        text: 4dn_FOF-CT_quality
        description: Spot Quality table (table 5)
      4dn_FOF-CT_rna_quality:
        text: 4dn_FOF-CT_rna_quality
        description: RNA Spot Quality table (table 6)
      4dn_FOF-CT_bio:
        text: 4dn_FOF-CT_bio
        description: Spot Biological Data table (table 7)
      4dn_FOF-CT_rna_bio:
        text: 4dn_FOF-CT_rna_bio
        description: RNA Spot Biological Data table (table 8)
      4dn_FOF-CT_cell:
        text: 4dn_FOF-CT_cell
        description: Cell Data table (table 9)
      4dn_FOF-CT_extracell:
        text: 4dn_FOF-CT_extracell
        description: Extra-Cell ROI Data table (table 10)
      4dn_FOF-CT_subcell:
        text: 4dn_FOF-CT_subcell
        description: Sub-Cell ROI Data table (table 11)
      4dn_FOF-CT_mapping:
        text: 4dn_FOF-CT_mapping
        description: Cell/ROI Mapping table (table 12)
      4dn_FOF-CT_vol_core:
        text: 4dn_FOF-CT_vol_core
        description: "SM Localization Data table \u2014 FOF-vol-CT (table 13)"
      4dn_FOF-CT_vol_quality:
        text: 4dn_FOF-CT_vol_quality
        description: "SM Localization Quality table \u2014 FOF-vol-CT (table 14)"
      4dn_FOF-CT_undecoded:
        text: 4dn_FOF-CT_undecoded
        description: "Undecoded SM Localization Data table \u2014 FOF-vol-CT (table\
          \ 15)"
slots:
  fof_ct_version:
    name: fof_ct_version
    definition_uri: https://w3id.org/fof-ct/fof_ct_version
    description: Version of the FOF-CT format used in this file. Always the first
      line of the file header (##FOF-CT_Version=).
    examples:
    - value: v1.0
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:fof_ct_version
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: string
    pattern: ^v[0-9]+\.[0-9]+
  table_namespace:
    name: table_namespace
    definition_uri: https://w3id.org/fof-ct/table_namespace
    description: 'Identifier for this table type. The required value is specific to
      each table. Written as ##Table_Namespace= in the file header.'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:table_namespace
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: string
  lab_name:
    name: lab_name
    definition_uri: https://w3id.org/fof-ct/lab_name
    description: 'Name of the laboratory where the experiment was performed. Written
      as #Lab_Name: in the file header.'
    examples:
    - value: Nobel
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:lab_name
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: string
  experimenter_name:
    name: experimenter_name
    definition_uri: https://w3id.org/fof-ct/experimenter_name
    description: 'Full name of the person who performed the experiment. Written as
      #Experimenter_Name: in the file header.'
    examples:
    - value: John Doe
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:experimenter_name
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: string
  experimenter_contact:
    name: experimenter_contact
    definition_uri: https://w3id.org/fof-ct/experimenter_contact
    description: 'Email address of the person who performed the experiment. Written
      as #Experimenter_Contact: in the file header.'
    examples:
    - value: john.doe@email.com
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:experimenter_contact
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: string
    pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
  description:
    name: description
    definition_uri: https://w3id.org/fof-ct/description
    description: 'Free-text description of the experiment and of the data recorded
      in this table. Should provide sufficient detail for interpretation and reproducibility.
      Written as #Description: in the file header.'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:description
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: string
  additional_tables:
    name: additional_tables
    definition_uri: https://w3id.org/fof-ct/additional_tables
    description: 'List of additional FOF-CT table namespaces being submitted alongside
      this table, separated by commas in the TSV header. Written as #Additional_Tables:
      in the file header.'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:additional_tables
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: TableNamespaceEnum
    multivalued: true
  softwares:
    name: softwares
    definition_uri: https://w3id.org/fof-ct/softwares
    description: 'One or more Software entries documenting every tool used to produce
      or process data in this table. Written as repeating #Software_* blocks in the
      file header.'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:softwares
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: Software
    multivalued: true
    inlined: true
    inlined_as_list: true
  xyz_unit:
    name: xyz_unit
    definition_uri: https://w3id.org/fof-ct/xyz_unit
    description: 'Unit used to represent X, Y, Z spatial coordinates or distances
      in this table. Use ''micron'' to avoid issues with Greek symbols. Values should
      be drawn from SI units of length. Written as ##XYZ_Unit= in the file header.
      Conditionally required when any location or distance metric is reported.'
    examples:
    - value: micron
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:xyz_unit
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: XYZUnitEnum
  time_unit:
    name: time_unit
    definition_uri: https://w3id.org/fof-ct/time_unit
    description: 'Unit used to represent time intervals in this table. Allowed values
      are SI time units plus ''min'' and ''hr''. Written as ##Time_Unit= in the file
      header. Conditionally required when any time metric is reported.'
    examples:
    - value: sec
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:time_unit
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: TimeUnitEnum
  intensity_unit:
    name: intensity_unit
    definition_uri: https://w3id.org/fof-ct/intensity_unit
    description: 'Unit used to represent intensity measurements in this table. Written
      as ##Intensity_Unit= in the file header. Conditionally required when any intensity
      metric is reported.'
    examples:
    - value: a.u.
    - value: photons
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:intensity_unit
    owner: UndecodedLocalizationTable
    domain_of:
    - DemultiplexingTable
    - TraceTable
    - RNASpotTable
    - SpotQualityTable
    - RNASpotQualityTable
    - SpotBiologicalTable
    - RNASpotBiologicalTable
    - CellTable
    - ExtraCellROITable
    - SubCellROITable
    - ROIMappingTable
    - SMLocalizationTable
    - SMLocalizationQualityTable
    - UndecodedLocalizationTable
    range: string
  intensity_measurement_method:
