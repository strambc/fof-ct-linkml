    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:cell_id
    owner: SMLocalization
    domain_of:
    - RNASpot
    - Cell
    - SubCellROI
    - ROIMapping
    - SMLocalization
    range: integer
  extra_cell_roi_id:
    name: extra_cell_roi_id
    definition_uri: https://w3id.org/fof-ct/extra_cell_roi_id
    description: Unique identifier for an extracellular structure ROI (e.g., tissue,
      organoid). Links to the Extra-Cell ROI Data table.
