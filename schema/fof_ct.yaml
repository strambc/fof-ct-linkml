classes:
  Software:
    name: Software
    definition_uri: https://w3id.org/fof-ct/Software
    description: 'Provenance metadata for a single software tool used to produce or
      process data in a FOF-CT table. If more than one tool was used, a separate Software
      entry must be provided for each. Written as a repeating block of #Software_*
      fields in the file header.'
    from_schema: https://w3id.org/fof-ct/common
    slots:
    - software_title
    - software_type
    - software_authors
    - software_description
    - software_repository
    - software_preferred_citation_id
    class_uri: fof_ct:Software
  LocalizationMixin:
    name: LocalizationMixin
    definition_uri: https://w3id.org/fof-ct/LocalizationMixin
    description: "Mixin capturing the shared concept of a single localization event\
      \ across FOF-CT modalities. Used by Localization (demultiplexing), SMLocalization\
      \ (vol_core), and UndecodedLocalization (undecoded). All three classes represent\
      \ the same atomic measurement unit \u2014 the sub-pixel position of a detected\
      \ fluorescence emission event \u2014 but differ in context, mandatory columns,\
      \ and table role."
    from_schema: https://w3id.org/fof-ct/common
    mixin: true
    slots:
    - loc_id
    - x
    - y
    - z
    class_uri: fof_ct:LocalizationMixin
  Localization:
    name: Localization
    definition_uri: https://w3id.org/fof-ct/Localization
    description: A single individual localisation event contributing to the final
      position of a bright DNA Spot in a multiplexed FISH experiment (e.g. MERFISH).
      Each instance of this class corresponds to one row in the CSV data section of
      the FOF-CT Spot Demultiplexing table. The spot_id field links each Localization
      to its parent Spot in the core table (or RNA Spot Data table); it may be NA
      when the localisation could not be assigned to any Spot. This class accepts
      additional user-defined optional columns (e.g. Hyb, Brightness, Fit_Quality).
    from_schema: https://w3id.org/fof-ct/demultiplexing
    mixins:
    - LocalizationMixin
    slots:
    - Localization_spot_id
    - Localization_fluor
    - Localization_loc_id
    - Localization_x
    - Localization_y
    - Localization_z
    slot_usage:
      loc_id:
        name: loc_id
        identifier: true
        required: true
      spot_id:
        name: spot_id
        required: true
      x:
        name: x
        required: true
      y:
        name: y
        required: true
      z:
        name: z
        required: true
      fluor:
        name: fluor
        required: true
    class_uri: fof_ct:Localization
  DemultiplexingTable:
    name: DemultiplexingTable
    definition_uri: https://w3id.org/fof-ct/DemultiplexingTable
    description: 'The Spot Demultiplexing table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_demultiplexing). This class represents the entire file: it holds
      all dataset-level provenance metadata (recorded as header lines in the CSV serialisation)
      together with the full collection of Localization events (recorded as data rows).
      Analogous to the MappingSet class in SSSOM. This table is optional but recommended
      for multiplexed FISH experiments.'
    from_schema: https://w3id.org/fof-ct/demultiplexing
    slots:
    - DemultiplexingTable_fof_ct_version
    - DemultiplexingTable_table_namespace
    - DemultiplexingTable_lab_name
    - DemultiplexingTable_experimenter_name
    - DemultiplexingTable_experimenter_contact
    - DemultiplexingTable_description
    - DemultiplexingTable_softwares
    - DemultiplexingTable_additional_tables
    - xyz_unit
    - time_unit
    - intensity_unit
    - intensity_measurement_method
    - DemultiplexingTable_localizations
    slot_usage:
      fof_ct_version:
        name: fof_ct_version
        required: true
      table_namespace:
        name: table_namespace
        required: true
        equals_string: 4dn_FOF-CT_demultiplexing
      lab_name:
        name: lab_name
        required: true
      experimenter_name:
        name: experimenter_name
        required: true
      experimenter_contact:
        name: experimenter_contact
        required: true
      description:
        name: description
        required: true
      softwares:
        name: softwares
        range: Software
        required: true
        multivalued: true
      additional_tables:
        name: additional_tables
        required: true
      localizations:
        name: localizations
        required: true
    class_uri: fof_ct:DemultiplexingTable
    tree_root: true
  Trace:
    name: Trace
    definition_uri: https://w3id.org/fof-ct/Trace
    description: 'A single chromatin Trace representing global properties associated
      with an entire polymeric trace rather than with individual Spots. Each instance
      of this class corresponds to one row in the CSV data section of the FOF-CT Trace
      Data table. The trace_id links each Trace to the core table and to the RNA Spot
      Data table. IMPORTANT: this class MUST contain at least one user-defined optional
      column describing trace-level properties (e.g., Allele, RNA_Expression, Lamina_Distance).
      User-defined columns are accommodated via open schema.'
    from_schema: https://w3id.org/fof-ct/trace
    slots:
    - Trace_trace_id
    slot_usage:
      trace_id:
        name: trace_id
        identifier: true
        required: true
    class_uri: fof_ct:Trace
  TraceTable:
    name: TraceTable
    definition_uri: https://w3id.org/fof-ct/TraceTable
    description: 'The Trace Data table of a FOF-bas-CT dataset (namespace: 4dn_FOF-CT_trace).
      This class represents the entire file: it holds all dataset-level provenance
      metadata (recorded as header lines in the CSV serialisation) together with the
      full collection of Traces (recorded as data rows). Analogous to the MappingSet
      class in SSSOM. This table is optional but recommended when trace-level properties
      are recorded.'
    from_schema: https://w3id.org/fof-ct/trace
