    - value: '1'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:trace_id
    owner: SMLocalization
    domain_of:
    - Trace
    - RNASpot
    - SMLocalization
    range: integer
  sub_cell_roi_id:
    name: sub_cell_roi_id
    definition_uri: https://w3id.org/fof-ct/sub_cell_roi_id
    description: Unique identifier for a sub-cellular structure ROI (e.g., nucleus,
