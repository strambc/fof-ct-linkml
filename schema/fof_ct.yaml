    - value: AlexaFluor_488
    - value: Cy5
    from_schema: https://w3id.org/fof-ct/quality
    slot_uri: fof_ct:fluorophore_name
    owner: SpotQualityRecord
    domain_of:
    - SpotQualityRecord
