    - value: '1'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:rna_spot_id
    owner: RNASpotBiologicalRecord
    domain_of:
    - RNASpot
    - RNASpotQualityRecord
    - RNASpotBiologicalRecord
    range: integer
  fluor:
    name: fluor
    definition_uri: https://w3id.org/fof-ct/fluor
    description: Fluorescent channel in which this localization event was detected
      (e.g. DAPI, GFP, Cy5, Alexa647). Mandatory in both the Spot Demultiplexing and
      Undecoded SM Localization tables.
    examples:
    - value: Cy5
    - value: Alexa647
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:fluor
    owner: UndecodedLocalization
    domain_of:
    - Localization
    - UndecodedLocalization
    range: string
  x_precision:
    name: x_precision
    definition_uri: https://w3id.org/fof-ct/x_precision
    description: Metric quantifying the precision of the X-axis localization estimate.
      Typically the Cramer-Rao lower bound or Thompson method estimate. Recommended
      in the Spot Quality table; mandatory in the SM Localization Quality table. Must
      be accompanied by a description in the file header.
    examples:
    - value: '0.01'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:x_precision
    owner: SMLocalizationQualityRecord
    domain_of:
    - SpotQualityRecord
    - SMLocalizationQualityRecord
    range: float
  y_precision:
    name: y_precision
    definition_uri: https://w3id.org/fof-ct/y_precision
    description: Metric quantifying the precision of the Y-axis localization estimate.
      Recommended in the Spot Quality table; mandatory in the SM Localization Quality
      table.
    examples:
    - value: '0.01'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:y_precision
    owner: SMLocalizationQualityRecord
    domain_of:
    - SpotQualityRecord
    - SMLocalizationQualityRecord
    range: float
  z_precision:
    name: z_precision
    definition_uri: https://w3id.org/fof-ct/z_precision
    description: Metric quantifying the precision of the Z-axis localization estimate.
      Recommended in the Spot Quality table; mandatory in the SM Localization Quality
      table.
    examples:
    - value: '0.02'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:z_precision
    owner: SMLocalizationQualityRecord
    domain_of:
    - SpotQualityRecord
    - SMLocalizationQualityRecord
    range: float
  photon_count:
    name: photon_count
    definition_uri: https://w3id.org/fof-ct/photon_count
    description: Number of photons detected for this localization event or Spot. Optional
      (but standardised name) in the Spot Quality table; recommended in the SM Localization
      Quality table.
    examples:
    - value: '1500'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:photon_count
    owner: SMLocalizationQualityRecord
    domain_of:
    - SpotQualityRecord
    - SMLocalizationQualityRecord
    range: integer
  goodness_of_fit:
    name: goodness_of_fit
    definition_uri: https://w3id.org/fof-ct/goodness_of_fit
    description: Metric quantifying how well the fitted model matches the observed
      signal (e.g. chi-squared, R-squared). Optional (but standardised name) in the
      Spot Quality table; recommended in the SM Localization Quality table.
    examples:
    - value: '0.95'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:goodness_of_fit
    owner: SMLocalizationQualityRecord
    domain_of:
    - SpotQualityRecord
    - SMLocalizationQualityRecord
    range: float
  frame_id:
    name: frame_id
    definition_uri: https://w3id.org/fof-ct/frame_id
    description: Unique integer identifier for the imaging frame in which this undecoded
      localization event was detected. Used in the Undecoded SM Localization table.
    examples:
    - value: '42'
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:frame_id
    owner: UndecodedLocalization
    domain_of:
    - UndecodedLocalization
    range: integer
  genome_assembly:
    name: genome_assembly
    definition_uri: https://w3id.org/fof-ct/genome_assembly
    description: 'Genome build used for Chrom, Chrom_Start and Chrom_End coordinates.
      The 4DN Data Portal accepts GRCh38 (human) and GRCm38 (mouse). When the genome
      under study contains an INSERTION or DELETION the value must use the mandatory
      ''custom-build:'' prefix followed by a descriptive name (e.g., custom-build:GRCm38+pJT039(insertion)).
      Written as ##Genome_Assembly= in the file header.'
    examples:
    - value: GRCh38
    - value: custom-build:GRCm38+pJT039(insertion)
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:genome_assembly
    owner: SMLocalizationTable
    domain_of:
    - RNASpotTable
    - SMLocalizationTable
    range: string
  cell_type:
    name: cell_type
    definition_uri: https://w3id.org/fof-ct/cell_type
    description: 'The type of cells present in this dataset, expressed using an ontology
      term from the Experimental Factor Ontology (EFO). Examples include "Cell in
      tissue" or "Cell in organoid". Written as #Cell_Type: in the file header.'
    examples:
    - value: Cell in tissue
    - value: Cell in organoid
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:cell_type
    owner: ROIMappingTable
    domain_of:
    - CellTable
    - SubCellROITable
    - ROIMappingTable
    range: string
  extra_cell_roi_type:
    name: extra_cell_roi_type
    definition_uri: https://w3id.org/fof-ct/extra_cell_roi_type
    description: 'The type of extracellular structure ROI within which cells are embedded,
      expressed using an EFO ''organism part'' child term (e.g. Tissue, Organoid).
      Conditionally required when extracellular structure ROIs are identified and
      reported in a dedicated Extra-Cell ROI Data table. Written as #Extra_Cell_ROI_Type:
      in the file header.'
    examples:
    - value: Tissue
    - value: Organoid
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:extra_cell_roi_type
    owner: ROIMappingTable
    domain_of:
    - CellTable
    - ExtraCellROITable
    - ROIMappingTable
    range: string
  sub_cell_roi_type:
    name: sub_cell_roi_type
    definition_uri: https://w3id.org/fof-ct/sub_cell_roi_type
    description: 'The type of sub-cellular structure ROI documented in this table
      or mapping file. It is recommended to use an EFO ''cellular_component'' child
      term. Examples include Nucleolus, NL (nuclear lamina), NPC (nuclear pore complex),
      PML_body, Cajal_body, Chromosome_Domain. Written as #Sub_Cell_ROI_Type: in the
      file header.'
    examples:
    - value: Nucleolus
    - value: NL
    - value: NPC
    - value: Chromosome_Domain
    from_schema: https://w3id.org/fof-ct/common
    slot_uri: fof_ct:sub_cell_roi_type
    owner: ROIMappingTable
    domain_of:
    - SubCellROITable
    - ROIMappingTable
    range: string
  software_title:
    name: software_title
    definition_uri: https://w3id.org/fof-ct/software_title
