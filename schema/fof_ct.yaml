      sub_cell_roi_id:
        name: sub_cell_roi_id
        description: Unique identifier for the Sub-Cell ROI whose boundaries are described
          in this row. Conditionally required when this file contains sub- cellular
          ROI boundary data. Exactly one of sub_cell_roi_id, cell_id, or extra_cell_roi_id
          must be used consistently throughout the file.
        range: integer
        required: false
      cell_id:
        name: cell_id
        description: Unique identifier for the Cell whose boundaries are described
          in this row. Conditionally required when this file contains Cell boundary
          data. Exactly one of sub_cell_roi_id, cell_id, or extra_cell_roi_id must
          be used consistently throughout the file.
        range: integer
        required: false
      extra_cell_roi_id:
        name: extra_cell_roi_id
        description: Unique identifier for the extracellular structure ROI whose boundaries
          are described in this row. Conditionally required when this file contains
          Extra-Cell ROI boundary data. Exactly one of sub_cell_roi_id, cell_id, or
          extra_cell_roi_id must be used consistently throughout the file.
        range: integer
        required: false
      roi_boundaries:
        name: roi_boundaries
        required: true
