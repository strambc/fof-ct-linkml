    from_schema: https://w3id.org/fof-ct/quality
    slot_uri: fof_ct:raw_y
    owner: SpotQualityRecord
    domain_of:
    - SpotQualityRecord
    range: float
  raw_z:
    name: raw_z
    definition_uri: https://w3id.org/fof-ct/raw_z
    description: Z coordinate of this Spot before any post-processing corrections.
