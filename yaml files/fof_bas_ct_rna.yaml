id: https://w3id.org/fof-ct/rna
name: fof_bas_ct_rna
description: >-
  FISH Omics Format for Chromatin Tracing - Ball-and-Stick modality (FOF-bas-CT).
  LinkML schema for the optional RNA Spot Data table (table 4). Stores RNA Spot
  data collected alongside Chromatin Tracing. Each row is one detected RNA
  bright Spot corresponding to one RNA transcript location. Modelled after the
  SSSOM pattern: a row-level class (RNASpot) captures each detected RNA Spot;
  a container class (RNASpotTable) holds the full collection together with
  dataset-level provenance metadata written in the FOF-CT file header.
license: CC-BY-4.0
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  fof_ct: https://w3id.org/fof-ct/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: fof_ct
default_range: string

imports:
  - linkml:types
  - fof_bas_ct_common

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  RNASpot:
    description: >-
      A single detected RNA bright Spot corresponding to one RNA transcript
      location detected alongside Chromatin Tracing. Each instance of this
      class corresponds to one row in the CSV data section of the FOF-CT RNA
      Spot Data table. The rna_spot_id links each RNASpot to the RNA Quality
      and RNA Biological Data tables; the trace_id links this RNA Spot to a
      DNA chromatin Trace in the core table and Trace Data table.
      This class accepts additional user-defined optional columns via
      additional_properties: true.
    additional_properties: true
    slots:
      - rna_spot_id
      - x
      - y
      - z
      - rna_name
      - gene_id
      - trace_id
      - transcript_id
      - sub_cell_roi_id
      - cell_id
      - extra_cell_roi_id
    slot_usage:
      rna_spot_id:
        required: true
      x:
        required: true
      y:
        required: true
      z:
        required: true
      rna_name:
        required: true
      gene_id:
        required: true
      trace_id:
        required: true

  RNASpotTable:
    description: >-
      The RNA Spot Data table of a FOF-bas-CT dataset (namespace:
      4dn_FOF-CT_rna). This class represents the entire file: it holds all
      dataset-level provenance metadata (recorded as header lines in the CSV
      serialisation) together with the full collection of RNA Spots (recorded
      as data rows). Analogous to the MappingSet class in SSSOM. This table
      is optional but recommended when RNA data are collected alongside
      Chromatin Tracing.
    tree_root: true
    slots:
      # --- mandatory header fields ---
      - fof_ct_version
      - table_namespace
      - genome_assembly
      - gene_id_type
      - xyz_unit
      - lab_name
      - experimenter_name
      - experimenter_contact
      - description
      - softwares
      - additional_tables
      # --- conditional header fields ---
      - transcript_id_type
      - time_unit
      - intensity_unit
      - intensity_measurement_method
      # --- data ---
      - rna_spots
    slot_usage:
      fof_ct_version:
        required: true
      table_namespace:
        required: true
        equals_string: 4dn_FOF-CT_rna
      genome_assembly:
        required: true
      gene_id_type:
        required: true
      xyz_unit:
        required: true
      lab_name:
        required: true
      experimenter_name:
        required: true
      experimenter_contact:
        required: true
      description:
        required: true
      softwares:
        required: true
        multivalued: true
        range: Software
      additional_tables:
        required: true
      rna_spots:
        required: true

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------

slots:

  # ---- RNASpotTable-level (header) slots ----------------------------------

  genome_assembly:
    description: >-
      Genome build used for the gene and transcript identifiers in this table.
      The 4DN Data Portal accepts GRCh38 (human) and GRCm38 (mouse). When the
      genome under study contains an insertion or deletion the value must use
      the mandatory 'custom-build:' prefix followed by a descriptive name
      (e.g., custom-build:GRCm38+pJT039(insertion)). Written as
      ##Genome_Assembly= in the file header.
    domain: RNASpotTable
    range: string
    examples:
      - value: GRCh38
      - value: custom-build:GRCm38+pJT039(insertion)

  gene_id_type:
    description: >-
      Type of gene identifier used in the gene_id column (e.g. Ensembl_V38,
      NCBI_Gene). Written as ##Gene_ID_Type= in the file header.
    domain: RNASpotTable
    range: string
    examples:
      - value: Ensembl_V38
      - value: NCBI_Gene

  transcript_id_type:
    description: >-
      Type of transcript identifier used in the transcript_id column
      (e.g. Ensembl_V38, RefSeq). Conditionally required when multiple
      transcripts share the same gene_id and the FISH probe can distinguish
      among them. Written as ##Transcript_ID_Type= in the file header.
    domain: RNASpotTable
    range: string
    examples:
      - value: Ensembl_V38
      - value: RefSeq

  # ---- RNASpot (row-level) slots ------------------------------------------

  rna_spot_id:
    description: >-
      A unique integer identifier for this RNA bright Spot, unique across the
      entire dataset. Links to the corresponding records in the RNA Quality
      and RNA Biological Data tables.
    domain: RNASpot
    range: integer
    identifier: true
    examples:
      - value: "1"

  x:
    description: >-
      Sub-pixel X coordinate of this RNA Spot in the unit specified by
      xyz_unit. The reported value is the final position after all
      post-processing corrections (drift correction, chromatic correction,
      etc.).
    domain: RNASpot
    range: float
    examples:
      - value: "14.43"

  y:
    description: >-
      Sub-pixel Y coordinate of this RNA Spot in the unit specified by
      xyz_unit. The reported value is the final position after all
      post-processing corrections.
    domain: RNASpot
    range: float
    examples:
      - value: "41.43"

  z:
    description: >-
      Sub-pixel Z coordinate of this RNA Spot in the unit specified by
      xyz_unit. The reported value is the final position after all
      post-processing corrections.
    domain: RNASpot
    range: float
    examples:
      - value: "1.23"

  rna_name:
    description: >-
      Official name of the gene from which the targeted RNA is transcribed
      (e.g. ACTB, GAPDH). Should follow HGNC (human) or MGI (mouse) gene
      nomenclature.
    domain: RNASpot
    range: string
    examples:
      - value: ACTB
      - value: GAPDH

  gene_id:
    description: >-
      Official gene identifier corresponding to rna_name. The type of
      identifier used (e.g. Ensembl gene ID, NCBI Gene ID) must be declared
      in the gene_id_type header field.
    domain: RNASpot
    range: string
    examples:
      - value: ENSG00000075624
      - value: ENSG00000111640

  transcript_id:
    description: >-
      Official transcript identifier for the specific transcript targeted by
      the FISH probe. Conditionally required when multiple transcripts share
      the same gene_id and the FISH probe can distinguish among them. The type
      of identifier used must be declared in the transcript_id_type header
      field.
    domain: RNASpot
    range: string
    examples:
      - value: ENST00000331789
      - value: NM_001101.5

  # ---- RNASpotTable-level (data) slot -------------------------------------

  rna_spots:
    description: >-
      The complete collection of RNA Spots constituting this dataset. Each
      RNASpot corresponds to one data row in the TSV serialisation.
    domain: RNASpotTable
    range: RNASpot
    multivalued: true
    inlined_as_list: true
